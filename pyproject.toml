[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "theme-drop"
version = "1.0.0"
description = "Install GNOME icon and cursor themes from archives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christopher Warner" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
theme-drop = "theme_drop.cli:main"

[tool.setuptools.packages.find]
include = ["theme_drop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
